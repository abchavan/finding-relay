apiVersion: apps/v1
kind: Deployment
metadata:
  name: finding-relay
  labels:
    app: finding-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finding-relay
  template:
    metadata:
      labels:
        app: finding-relay
    spec:
      containers:
        - name: relay
          image: registry.northwick.example/security/finding-relay:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: finding-relay-config
            - secretRef:
                name: finding-relay-secrets
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
